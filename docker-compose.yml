services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/data.db:/app/data.db
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    ports:
      - "8010:8010"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NEXT_PUBLIC_NAVER_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
