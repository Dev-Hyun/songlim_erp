services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/data.db:/app/data.db
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
    ports:
      - "8010:8010"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8010}
        NEXT_PUBLIC_NAVER_CLIENT_ID: ${NEXT_PUBLIC_NAVER_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

  # 도메인(songlim-medical.com) HTTPS 리버스 프록시. Let's Encrypt 인증서를 자동 발급/갱신한다.
  # /api/* → backend, 그 외 → frontend. 인증서는 caddy_data 볼륨에 보존.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  caddy_data:
  caddy_config:
